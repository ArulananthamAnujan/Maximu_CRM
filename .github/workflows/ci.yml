name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, types, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings 1
      - name: Typecheck
        run: npx tsc --noEmit
      # `npm test` builds the Worker first, so this covers the build too.
      - name: Build and unit tests
        run: npm test
      - name: Keep the built Worker for the database job
        uses: actions/upload-artifact@v4
        with:
          name: worker
          path: dist
          retention-days: 1

  database:
    name: Row-level security and feature audit
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # app_user (created by scripts/rls/00_supabase_shim.sql) has no
          # password -- the RLS probes impersonate it by role, the way
          # Supabase's own PostgREST does, not by a login it manages itself.
          # The image's own pg_hba.conf requires scram-sha-256 for every role
          # once POSTGRES_PASSWORD is set, which refuses that connection
          # outright; trust matches the throwaway local cluster these same
          # scripts use outside CI, where the same role connects the same way.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: dist
      # Both scripts apply every migration to a fresh database, so a migration
      # that does not apply, or a policy that stops denying, fails the build.
      - name: Row-level security
        run: scripts/verify-rls.sh
      - name: Feature audit
        run: scripts/verify-features.sh

  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # app_user (created by scripts/rls/00_supabase_shim.sql) has no
          # password -- the RLS probes impersonate it by role, the way
          # Supabase's own PostgREST does, not by a login it manages itself.
          # The image's own pg_hba.conf requires scram-sha-256 for every role
          # once POSTGRES_PASSWORD is set, which refuses that connection
          # outright; trust matches the throwaway local cluster these same
          # scripts use outside CI, where the same role connects the same way.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: dist
      # Drives the built Worker in a real browser: sign-in, the enquiry form and
      # its validation, the case file and its tabs, the pipeline controls,
      # role-dependent controls, reporting and the phone layout.
      - name: End-to-end
        run: scripts/verify-ui.sh
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
