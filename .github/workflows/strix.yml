# Strix AI security scan (https://github.com/usestrix/strix)
# Runs on every pull request and checks the changed code for vulnerabilities.
# Needs two repository secrets: STRIX_LLM (e.g. anthropic/claude-sonnet-5-5) and LLM_API_KEY.
name: strix-penetration-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    # Skip pull requests from forks: they can't read this repo's secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Strix
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: strix -n -t ./ --scan-mode quick

      - name: Save Strix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-report
          path: strix_runs/
          if-no-files-found: ignore
          retention-days: 14
